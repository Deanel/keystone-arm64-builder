name: Build Keystone Engine ARM64

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Linux ARM64 Python 3.12
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify build environment
        run: |
          uname -m
          lsb_release -a
          python3.12 --version

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            git \
            pkg-config \
            python3.12 \
            python3.12-dev \
            python3.12-venv

      - name: Prepare Python environment
        run: |
          python3.12 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip setuptools wheel

      - name: Build Keystone wheel
        run: |
          mkdir -p wheelhouse
          .venv/bin/python -m pip wheel \
            --no-deps \
            --no-cache-dir \
            keystone-engine==0.9.2 \
            --wheel-dir wheelhouse

      - name: Test wheel
        run: |
          .venv/bin/python -m pip install wheelhouse/*.whl

          .venv/bin/python - <<'PY'
          import keystone

          print("Keystone version:", keystone.__version__)

          ks = keystone.Ks(
              keystone.KS_ARCH_ARM64,
              keystone.KS_MODE_LITTLE_ENDIAN
          )

          encoding, count = ks.asm("mov x0, x1")

          print("ARM64 assembly test: PASS")
          print("Instruction count:", count)
          print("Machine code:", bytes(encoding).hex())
          PY

      - name: Show wheel information
        run: |
          ls -lh wheelhouse/
          unzip -p wheelhouse/*.whl '*.dist-info/WHEEL'

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: keystone-engine-0.9.2-linux-arm64-py312
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 30